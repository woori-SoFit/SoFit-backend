# ===========================================
# SoFit 공통 설정 (환경 무관, 모든 모듈 공유)
# 각 모듈에서 spring.profiles.include: common 으로 포함
# ===========================================

spring:
  # JPA 공통 설정
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  # Datasource 공통
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis 세션 공통 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Session
  session:
    store-type: redis
    timeout: 1800  # 30분

# SpringDoc (Swagger UI) 공통 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

---
# 로컬 개발용 (local 프로파일)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:13306/sofit_test_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
  data:
    redis:
      host: localhost
      port: 16379

---
# dev 서버 배포용 (dev 프로파일)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/sofit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

---
# 테스트 서버용 (test 프로파일)
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/sofit_test_v3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  sql:
    init:
      mode: never
      data-locations:
        - classpath:sql/data_static.sql
        - classpath:sql/data_dummy.sql
      encoding: UTF-8
