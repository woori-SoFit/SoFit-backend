# ===========================================
# SoFit 공통 설정 (환경 무관, 모든 모듈 공유)
# 각 모듈에서 spring.profiles.include: common 으로 포함
# ===========================================

spring:
  # JPA 공통 설정
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  # Datasource 공통
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis 세션 공통 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Session
  session:
    store-type: redis
    timeout: 1800  # 30분

# SpringDoc (Swagger UI) 공통 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 감사 로그(접근기록) 트랙
#  - enabled=true 면 audit 전용 DataSource/Aspect 활성화 (audit_writer 계정 필요)
#  - url 미지정 시 앱 메인 DB(spring.datasource.url)를 그대로 사용 (테이블만 audit_log)
#  - 자격증명은 env 로만 주입 (평문 커밋 금지). scripts/sql/audit_log.sql 로 계정/테이블 선생성
audit:
  enabled: ${AUDIT_ENABLED:true}
  datasource:
    url: ${AUDIT_DB_URL:${spring.datasource.url}}
    username: ${AUDIT_DB_USERNAME:audit_writer}
    password: ${AUDIT_DB_PASSWORD:}

---
# 로컬 개발용 (local 프로파일)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # SSH 터널: localhost:13306 / 직접 접속: 172.21.33.238:3306
    url: jdbc:mysql://172.21.33.238:3306/sofit_logging_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
  data:
    redis:
      host: localhost
      port: 16379
# 로깅 테스트용 DB(sofit_logging_test)에는 audit_writer 계정이 세팅되어 있음
# 감사 로그 테스트 시: AUDIT_ENABLED=true, AUDIT_DB_PASSWORD=1234
audit:
  enabled: ${AUDIT_ENABLED:false}

---
# dev 서버 배포용 (dev 프로파일)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/sofit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

---
# 테스트 서버용 (test 프로파일)
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/sofit_test_v3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  sql:
    init:
      mode: never
      data-locations:
        - classpath:sql/data_static.sql
        - classpath:sql/data_dummy.sql
      encoding: UTF-8
