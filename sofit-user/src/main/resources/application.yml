spring:
  application:
    name: sofit-user

  # 활성 프로파일 (local / dev / release)
  profiles:
    active: dev

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  # Redis 세션
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Session (Redis 사용)
  session:
    store-type: redis
    timeout: 1800  # 30분

server:
  port: 8080
  servlet:
    context-path: /

# External Mock 서버
external:
  mock:
    url: ${EXTERNAL_MOCK_URL:http://localhost:9090}

# CODEF API
codef:
  client-id: ${CODEF_CLIENT_ID:}
  client-secret: ${CODEF_CLIENT_SECRET:}
  base-url: ${CODEF_BASE_URL:https://development.codef.io}
  oauth-url: ${CODEF_OAUTH_URL:https://oauth.codef.io/oauth/token}

# SoFit 내부 설정
sofit:
  storage:
    # 약관 PDF 등 정적 리소스 base URL (응답 시 상대 경로 앞에 붙여서 조립)
    # MVP: Spring Boot static/ 정적 리소스 / 향후 AWS 이전 시 S3 도메인으로 교체
    base-url: ${STORAGE_BASE_URL:http://localhost:8080}

# SpringDoc (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
