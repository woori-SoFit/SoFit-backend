spring:
  # 로컬 개발용 MySQL (loclx 터널로 dev DB 접근)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://us.loclx.io:23453/sofit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: us.loclx.io
      port: 47646

# 로컬 개발 CORS (여러 Origin 허용 시 콤마로 구분)
app:
  cors:
    allowed-origins: http://localhost:3001

# sofit-user 서버 내부 URL (알림 푸시용)
sofit:
  user:
    internal-url: http://localhost:8080
