spring:
  # dev 서버 배포용 MySQL (환경변수 참조)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/sofit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# dev 서버 CORS (on-premise IP + 외부 접속 도메인)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

# sofit-user 서버 내부 URL (알림 푸시용, Docker 네트워크 내부 통신)
sofit:
  user:
    internal-url: ${SOFIT_USER_INTERNAL_URL:http://localhost:8080}
